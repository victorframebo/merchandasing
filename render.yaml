services:
  - type: web
    name: tienda-oikos
    runtime: node
    plan: starter
    buildCommand: echo "sin dependencias"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: oikos-data
      mountPath: /var/data
      sizeGB: 1
